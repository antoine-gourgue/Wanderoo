services:
  db:
    image: postgres:16-alpine
    container_name: wanderoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wanderoo
      POSTGRES_PASSWORD: wanderoo
      POSTGRES_DB: wanderoo
    ports:
      - "5544:5432"
    volumes:
      - wanderoo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderoo -d wanderoo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wanderoo_pgdata:
